[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
rustwing = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
serde_json = "1"
uuid = { version = "1.8", features = ["v7"] }
chrono = "0.4"
