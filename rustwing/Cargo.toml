[package]
name = "rustwing"
version = "0.1.10"
edition = "2024"
description = "The application framework for building Rust apps with Axum — auth, CRUD scaffolding, migrations, workers, and LLM hooks included."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/creativebash/rustwing"
keywords = ["saas", "web", "framework", "axum", "crud"]
categories = ["web-programming", "database"]

[dependencies]
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "json", "chrono", "macros", "migrate"] }
uuid = { version = "1.8", features = ["v7", "serde"] }
rig = { package = "rig-core", version = "0.38.2" }
thiserror = "2.0"
tracing = "0.1"
argon2 = "0.5.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
